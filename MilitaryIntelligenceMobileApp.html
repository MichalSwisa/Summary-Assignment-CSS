<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@500;600;700&display=swap"
        rel="stylesheet">
    <title>Military Intelligence Mobile App</title>
</head>

<body>
    <header class="header">
        <div class="sheild-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <p>SIGINT OPS</p>
        <div class="online-menu">
            <P id="light-dot">⋅</P>
            <p>SECURE⋅ONLINE</p>
        </div>
    </header>

    <main class="main">
        <div class='radar'>
            <div class='sweep'></div>
            <div class="radar-dot" id="dot1"></div>
            <div class="radar-dot" id="dot2"></div>
            <div class="radar-dot" id="dot3"></div>
        </div>

        <div class="radar-info">
            <div class="radar-info-item">
                <h2>24</h2>
                <p>ACTIVE SIGNALS</p>
            </div>
            <div class="radar-info-item">
                <h2>07</h2>
                <p>PRIORITY ALERTS</p>
            </div>
        </div>
    </main>

    <section class="secondry">
        <div class="buttons">
            <button class="btn"><i class="fa-solid fa-bolt"></i> New Brief</button>
            <button class="btn"><i class="fa-solid fa-code"></i> Decode</button>
            <button class="btn"><i class="fa-solid fa-plane-up"></i> Request Drone</button>
        </div>
        <div class="cards">
            <div class="card critical">
                <div class="card-header">
                    <span class="card-priority">CRITICAL</span>
                    <span class="card-status">In Progress</span>

                </div>
                <h3 class="card-title">Operation Nightfall</h3>

                <div class="card-content">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <span class="progress-percent" style="--progress: 65%;">65%</span>
                </div>
            </div>

            <div class="card high">
                <div class="card-header">
                    <span class="card-priority">HIGH</span>
                    <span class="card-status">Analyzing</span>
                </div>

                <h3 class="card-title">Signal Intercept Alpha</h3>

                <div class="card-content">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <span class="progress-percent" style="--progress: 40%;">40%</span>
                </div>
            </div>

            <div class="card medium">
                <div class="card-header">
                    <span class="card-priority">MEDIUM</span>
                    <span class="card-status">Pending</span>
                </div>

                <h3 class="card-title">Asset Recovery</h3>

                <div class="card-content">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <span class="progress-percent" style="--progress: 15%;"></span>
                </div>
            </div>

            <div class="card high">
                <div class="card-header">
                    <span class="card-priority">HIGH</span>
                    <span class="card-status">Active</span>
                </div>

                <h3 class="card-title">Cyber Defense Grid</h3>

                <div class="card-content">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <span class="progress-percent" style="--progress: 80%;">80%</span>
                </div>
            </div>

        </div>


        <div class="threat-detect">
            <div class="dot"></div>
            <p>THREAT DETECTED</p>
        </div>

    </section>
    <footer>

    </footer>

</body>

</html>
